version: '3.8'

services:
  # Zookeeper - required for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - energy-network

  # Kafka - message broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - energy-network

  # MQTT Broker (Mosquitto)
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - energy-network

  # InfluxDB - time-series database
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: energy_db
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: adminpassword
      INFLUXDB_HTTP_AUTH_ENABLED: 'false'
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - energy-network

  # Ethereum Local Node (Hardhat JSON-RPC)
  hardhat:
    image: node:18-alpine
    container_name: hardhat-node
    working_dir: /app
    volumes:
      - ./smart-contracts:/app
    ports:
      - "8545:8545"
    command: sh -c "npm install && npx hardhat node --hostname 0.0.0.0"
    networks:
      - energy-network

  # Phase 2: Meter Simulator
  meter-simulator:
    build:
      context: ./meter-simulator
      dockerfile: Dockerfile
    container_name: meter-simulator
    depends_on:
      - mqtt
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
    networks:
      - energy-network
    restart: unless-stopped

  # Phase 3: MQTT to Kafka Bridge
  kafka-producer:
    build:
      context: ./kafka-producer
      dockerfile: Dockerfile
    container_name: kafka-producer
    depends_on:
      - mqtt
      - kafka
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      KAFKA_BROKER: kafka:29092
    networks:
      - energy-network
    restart: unless-stopped

  # Phase 4: Real-Time Stream Processing (Spark)
  spark-streaming:
    build:
      context: ./spark-streaming
      dockerfile: Dockerfile
    container_name: spark-streaming
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:29092
    networks:
      - energy-network
    restart: unless-stopped

  # Phase 5: Storage Service (InfluxDB)
  storage-service:
    build:
      context: ./storage-service
      dockerfile: Dockerfile
    container_name: storage-service
    depends_on:
      - kafka
      - influxdb
    environment:
      KAFKA_BROKER: kafka:29092
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: 8086
    networks:
      - energy-network
    restart: unless-stopped

  # Phase 6: Matching Engine
  matching-engine:
    build:
      context: ./matching-engine
      dockerfile: Dockerfile
    container_name: matching-engine
    depends_on:
      - kafka
    ports:
      - "8001:8001"
    environment:
      KAFKA_BROKER: kafka:29092
    networks:
      - energy-network
    restart: unless-stopped

  # Phase 7: Pricing Engine
  pricing-engine:
    build:
      context: ./pricing-engine
      dockerfile: Dockerfile
    container_name: pricing-engine
    depends_on:
      - kafka
    ports:
      - "8002:8002"
    environment:
      KAFKA_BROKER: kafka:29092
    networks:
      - energy-network
    restart: unless-stopped

networks:
  energy-network:
    driver: bridge

volumes:
  influxdb-data:
