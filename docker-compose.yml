version: '3.8'

services:
  # Zookeeper - required for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - energy-network

  # Kafka - message broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - energy-network

  # MQTT Broker (Mosquitto)
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - energy-network

  # InfluxDB - time-series database (v2.x auto-setup)
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword123
      DOCKER_INFLUXDB_INIT_ORG: energy_org
      DOCKER_INFLUXDB_INIT_BUCKET: energy_db
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: energy-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - energy-network

  # Ethereum Local Node (Hardhat JSON-RPC) + auto-deploy of EnergyTrade
  hardhat:
    image: node:18-alpine
    container_name: hardhat-node
    working_dir: /app
    volumes:
      - ./smart-contracts:/app
    ports:
      - "8545:8545"
    # Install deps, start the node in the background, wait for it, deploy the
    # contract (writes deployments/EnergyTrade.json), then keep the node in the
    # foreground so the container stays alive.
    command: >
      sh -c "npm install &&
             npx hardhat node --hostname 0.0.0.0 &
             until nc -z localhost 8545; do echo 'waiting for node...'; sleep 1; done &&
             sleep 2 &&
             npx hardhat run scripts/deploy.js --network localhost &&
             wait"
    healthcheck:
      test: ["CMD", "test", "-f", "/app/deployments/EnergyTrade.json"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - energy-network

  # Phase 2: Meter Simulator
  meter-simulator:
    build:
      context: ./meter-simulator
      dockerfile: Dockerfile
    container_name: meter-simulator
    depends_on:
      - mqtt
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
    networks:
      - energy-network
    restart: unless-stopped

  # Phase 3: MQTT to Kafka Bridge
  kafka-producer:
    build:
      context: ./kafka-producer
      dockerfile: Dockerfile
    container_name: kafka-producer
    depends_on:
      mqtt:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      KAFKA_BROKER: kafka:29092
    networks:
      - energy-network
    restart: unless-stopped

  # Phase 4: Real-Time Stream Processing (Spark)
  spark-streaming:
    build:
      context: ./spark-streaming
      dockerfile: Dockerfile
    container_name: spark-streaming
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:29092
    volumes:
      - spark-checkpoint:/checkpoint
    networks:
      - energy-network
    restart: unless-stopped

  # Phase 5: Storage Service (InfluxDB)
  storage-service:
    build:
      context: ./storage-service
      dockerfile: Dockerfile
    container_name: storage-service
    depends_on:
      kafka:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:29092
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: 8086
    networks:
      - energy-network
    restart: unless-stopped

  # Phase 6: Matching Engine
  matching-engine:
    build:
      context: ./matching-engine
      dockerfile: Dockerfile
    container_name: matching-engine
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      KAFKA_BROKER: kafka:29092
    networks:
      - energy-network
    restart: unless-stopped

  # Phase 7: Pricing Engine
  pricing-engine:
    build:
      context: ./pricing-engine
      dockerfile: Dockerfile
    container_name: pricing-engine
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8002:8002"
    environment:
      KAFKA_BROKER: kafka:29092
    networks:
      - energy-network
    restart: unless-stopped

  # Phase 9: Blockchain Integration Service
  blockchain-service:
    build:
      context: ./blockchain-service
      dockerfile: Dockerfile
    container_name: blockchain-service
    depends_on:
      hardhat:
        condition: service_healthy
    ports:
      - "8003:8003"
    environment:
      ETH_RPC: http://hardhat:8545
      DEPLOYMENT_PATH: /deployments/EnergyTrade.json
    volumes:
      # Read the contract address/ABI written by the hardhat deploy step
      - ./smart-contracts/deployments:/deployments:ro
    networks:
      - energy-network
    restart: unless-stopped

  # Phases 10 & 11: Forecasting Service (demand ARIMA + price ML)
  forecasting-service:
    build:
      context: ./forecasting-service
      dockerfile: Dockerfile
    container_name: forecasting-service
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "8004:8004"
    environment:
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: 8086
    networks:
      - energy-network
    restart: unless-stopped

  # Phase 12: API Gateway (single entry point + JWT auth)
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    depends_on:
      - matching-engine
      - pricing-engine
      - forecasting-service
      - blockchain-service
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: dev-secret-change-me
      MATCHING_URL: http://matching-engine:8001
      PRICING_URL: http://pricing-engine:8002
      FORECAST_URL: http://forecasting-service:8004
      BLOCKCHAIN_URL: http://blockchain-service:8003
    networks:
      - energy-network
    restart: unless-stopped

networks:
  energy-network:
    driver: bridge

volumes:
  influxdb-data:
  spark-checkpoint:
