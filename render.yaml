services:
  # 1. API Gateway (Web Service)
  - type: web
    name: api-gateway
    env: docker
    dockerfilePath: api-gateway/Dockerfile
    plan: free
    envVars:
      - key: JWT_SECRET
        value: dev-secret-change-me
      - key: MATCHING_URL
        value: http://matching-engine:8001
      - key: PRICING_URL
        value: http://pricing-engine:8002
      - key: FORECAST_URL
        value: http://forecasting-service:8004
      - key: BLOCKCHAIN_URL
        value: http://blockchain-service:8003

  # 2. Demo Orchestrator (Web Service for WebSockets)
  - type: web
    name: demo-orchestrator
    env: docker
    dockerfilePath: demo-orchestrator/Dockerfile
    plan: free
    envVars:
      - key: KAFKA_BROKER
        value: kafka:9092
      - key: MQTT_HOST
        value: mqtt-broker
      - key: MQTT_PORT
        value: "1883"
      - key: MATCHING_URL
        value: http://matching-engine:8001
      - key: PRICING_URL
        value: http://pricing-engine:8002
      - key: BLOCKCHAIN_URL
        value: http://blockchain-service:8003
      - key: FORECAST_URL
        value: http://forecasting-service:8004
      - key: AUTO_TRADE
        value: "true"
      - key: AUTO_SETTLE
        value: "true"

  # 3. Matching Engine (Private Service)
  - type: pserv
    name: matching-engine
    env: docker
    dockerfilePath: matching-engine/Dockerfile
    plan: free
    envVars:
      - key: KAFKA_BROKER
        value: kafka:9092

  # 4. Pricing Engine (Private Service)
  - type: pserv
    name: pricing-engine
    env: docker
    dockerfilePath: pricing-engine/Dockerfile
    plan: free
    envVars:
      - key: KAFKA_BROKER
        value: kafka:9092

  # 5. Blockchain Integration Service (Private Service)
  - type: pserv
    name: blockchain-service
    env: docker
    dockerfilePath: blockchain-service/Dockerfile
    plan: free
    envVars:
      - key: ETH_RPC
        value: http://hardhat-node:8545
      - key: DEPLOYMENT_PATH
        value: /app/deployments/EnergyTrade.json

  # 6. Forecasting Service (Private Service)
  - type: pserv
    name: forecasting-service
    env: docker
    dockerfilePath: forecasting-service/Dockerfile
    plan: free
    envVars:
      - key: INFLUXDB_HOST
        value: influxdb
      - key: INFLUXDB_PORT
        value: "8086"

  # 7. InfluxDB (Private Service using Dockerfile)
  - type: pserv
    name: influxdb
    env: docker
    dockerfilePath: docker/Dockerfile.influxdb
    plan: free
    envVars:
      - key: DOCKER_INFLUXDB_INIT_MODE
        value: setup
      - key: DOCKER_INFLUXDB_INIT_USERNAME
        value: admin
      - key: DOCKER_INFLUXDB_INIT_PASSWORD
        value: adminpassword123
      - key: DOCKER_INFLUXDB_INIT_ORG
        value: energy_org
      - key: DOCKER_INFLUXDB_INIT_BUCKET
        value: energy_db
      - key: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
        value: energy-token

  # 8. Hardhat Local Node (Private Service)
  - type: pserv
    name: hardhat-node
    env: docker
    dockerfilePath: smart-contracts/Dockerfile
    plan: free

  # 9. MQTT Broker / Mosquitto (Private Service)
  - type: pserv
    name: mqtt-broker
    env: docker
    dockerfilePath: docker/Dockerfile.mosquitto
    plan: free

  # 10. Zookeeper (Private Service for Kafka)
  - type: pserv
    name: zookeeper
    env: docker
    dockerfilePath: docker/Dockerfile.zookeeper
    plan: free
    envVars:
      - key: ZOOKEEPER_CLIENT_PORT
        value: "2181"
      - key: ZOOKEEPER_TICK_TIME
        value: "2000"

  # 11. Kafka Broker (Private Service)
  - type: pserv
    name: kafka
    env: docker
    dockerfilePath: docker/Dockerfile.kafka
    plan: free
    envVars:
      - key: KAFKA_BROKER_ID
        value: "1"
      - key: KAFKA_ZOOKEEPER_CONNECT
        value: zookeeper:2181
      - key: KAFKA_ADVERTISED_LISTENERS
        value: PLAINTEXT://kafka:9092
      - key: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
        value: "1"
